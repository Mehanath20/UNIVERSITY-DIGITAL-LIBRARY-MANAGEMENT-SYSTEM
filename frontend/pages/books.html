<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Catalog | University Digital Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div id="navbar-container"></div>

  <div class="container py-4">
    <!-- Breadcrumb & Header -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
      <div>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-1 small">
            <li class="breadcrumb-item"><a href="/index.html">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Catalog</li>
          </ol>
        </nav>
        <h2 class="font-serif fw-bold mb-0">University Academic Catalog</h2>
      </div>

      <div id="staff-catalog-actions" class="d-none mt-2 mt-md-0">
        <button class="btn btn-academic-gold btn-sm" data-bs-toggle="modal" data-bs-target="#newBookModal">
          <i class="bi bi-plus-circle me-1"></i>Add New Volume
        </button>
      </div>
    </div>

    <div class="row g-4">
      <!-- Left Filter Panel -->
      <div class="col-lg-3">
        <div class="card-academic p-4" style="position: sticky; top: 90px;">
          <h5 class="fw-bold mb-3 pb-2 border-bottom font-serif">
            <i class="bi bi-funnel text-warning me-1"></i>Filter Catalog
          </h5>

          <!-- Search Input -->
          <div class="mb-3">
            <label class="form-label small fw-semibold text-muted">Keyword Search</label>
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
              <input type="text" id="filter-keyword" class="form-control" placeholder="Title, author, ISBN..." oninput="debounceFilter()">
            </div>
          </div>

          <!-- Category -->
          <div class="mb-3">
            <label class="form-label small fw-semibold text-muted">Subject Discipline</label>
            <select id="filter-category" class="form-select form-select-sm" onchange="loadCatalog(1)">
              <option value="" selected>All Disciplines</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Artificial Intelligence">Artificial Intelligence</option>
              <option value="Data Science">Data Science</option>
              <option value="Database">Database Systems</option>
              <option value="Networking">Networking</option>
              <option value="Operating Systems">Operating Systems</option>
              <option value="Programming">Programming</option>
              <option value="Mathematics">Mathematics</option>
            </select>
          </div>

          <!-- Author Filter -->
          <div class="mb-3">
            <label class="form-label small fw-semibold text-muted">Author</label>
            <input type="text" id="filter-author" class="form-control form-control-sm" placeholder="Author name..." oninput="debounceFilter()">
          </div>

          <!-- Availability -->
          <div class="mb-4">
            <label class="form-label small fw-semibold text-muted">Circulation Availability</label>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="availFilter" id="avail-all" value="all" checked onchange="loadCatalog(1)">
              <label class="form-check-label small" for="avail-all">All Catalog Volumes</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="availFilter" id="avail-only" value="true" onchange="loadCatalog(1)">
              <label class="form-check-label small text-success fw-semibold" for="avail-only">In Stock / Available Only</label>
            </div>
          </div>

          <button class="btn btn-academic-outline btn-sm w-100" onclick="resetFilters()">
            <i class="bi bi-arrow-counterclockwise me-1"></i>Reset Filters
          </button>
        </div>
      </div>

      <!-- Right Catalog Grid -->
      <div class="col-lg-9">
        <!-- Results Bar -->
        <div class="card-academic p-3 mb-3 d-flex flex-row justify-content-between align-items-center">
          <div class="small text-muted" id="catalog-count-label">Loading volumes...</div>
          <div class="d-flex align-items-center gap-2">
            <label class="small text-muted mb-0 d-none d-sm-inline">Sort by:</label>
            <select id="catalog-sort" class="form-select form-select-sm" style="width: auto;" onchange="loadCatalog(1)">
              <option value="title_asc">Title (A – Z)</option>
              <option value="title_desc">Title (Z – A)</option>
              <option value="year_desc">Publication Year (Newest)</option>
              <option value="copies_desc">Available Copies</option>
            </select>
          </div>
        </div>

        <!-- Book Grid -->
        <div class="row g-4" id="catalog-grid"></div>

        <!-- Pagination -->
        <div id="catalog-pagination" class="mt-4"></div>
      </div>
    </div>
  </div>

  <!-- Issue Book Modal for Staff -->
  <div class="modal fade" id="issueBookModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content card-academic p-3">
        <div class="modal-header border-bottom pb-2">
          <h5 class="modal-title font-serif fw-bold"><i class="bi bi-arrow-right-circle text-primary me-2"></i>Issue Book</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form onsubmit="submitIssueBook(event)">
          <div class="modal-body py-3">
            <input type="hidden" id="issue-book-id">
            <div class="mb-3">
              <label class="form-label small fw-semibold text-muted">Book Title</label>
              <input type="text" id="issue-book-title" class="form-control form-control-sm" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold text-muted">Member Identifier</label>
              <input type="text" id="issue-member-id" class="form-control form-control-sm" placeholder="e.g. MEM-2025-1001 or alice.student@library.edu" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold text-muted">Desk Circulation Notes</label>
              <input type="text" id="issue-notes" class="form-control form-control-sm" placeholder="Standard checkout">
            </div>
          </div>
          <div class="modal-footer border-top pt-2">
            <button type="button" class="btn btn-academic-outline btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-academic-primary btn-sm">Confirm Issue</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Add New Book Modal for Staff -->
  <div class="modal fade" id="newBookModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content card-academic p-3">
        <div class="modal-header border-bottom pb-2">
          <h5 class="modal-title font-serif fw-bold"><i class="bi bi-plus-square text-warning me-2"></i>Catalog New Academic Book</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form onsubmit="submitCreateBook(event)">
          <div class="modal-body py-3">
            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label small fw-semibold text-muted">Book Title</label>
                <input type="text" id="new-book-title" class="form-control form-control-sm" required>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold text-muted">ISBN</label>
                <input type="text" id="new-book-isbn" class="form-control form-control-sm" placeholder="978-..." required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold text-muted">Author(s)</label>
                <input type="text" id="new-book-author" class="form-control form-control-sm" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold text-muted">Subject Discipline</label>
                <select id="new-book-category" class="form-select form-select-sm" required>
                  <option value="Computer Science">Computer Science</option>
                  <option value="Artificial Intelligence">Artificial Intelligence</option>
                  <option value="Data Science">Data Science</option>
                  <option value="Database">Database Systems</option>
                  <option value="Networking">Networking</option>
                  <option value="Operating Systems">Operating Systems</option>
                  <option value="Programming">Programming</option>
                  <option value="Mathematics">Mathematics</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold text-muted">Publisher</label>
                <input type="text" id="new-book-publisher" class="form-control form-control-sm">
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-semibold text-muted">Publication Year</label>
                <input type="number" id="new-book-year" class="form-control form-control-sm" value="2024">
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-semibold text-muted">Total Copies</label>
                <input type="number" id="new-book-copies" class="form-control form-control-sm" value="5" min="1" required>
              </div>
              <div class="col-12">
                <label class="form-label small fw-semibold text-muted">Book Abstract / Description</label>
                <textarea id="new-book-desc" class="form-control form-control-sm" rows="3"></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer border-top pt-2">
            <button type="button" class="btn btn-academic-outline btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-academic-gold btn-sm">Save Book</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer class="academic-footer">
    <div class="container text-center text-white-50">
      <small>© 2025 University Digital Library Management System. Academic Enterprise Edition.</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/books.js"></script>
  <script>
    let filterDebounce;
    function debounceFilter() {
      clearTimeout(filterDebounce);
      filterDebounce = setTimeout(() => {
        loadCatalog(1);
      }, 350);
    }

    function resetFilters() {
      document.getElementById('filter-keyword').value = '';
      document.getElementById('filter-category').value = '';
      document.getElementById('filter-author').value = '';
      document.getElementById('avail-all').checked = true;
      loadCatalog(1);
    }

    async function loadCatalog(page = 1) {
      const user = API.getUser();
      renderNavbar('books');

      const keyword = document.getElementById('filter-keyword').value.trim();
      const category = document.getElementById('filter-category').value;
      const author = document.getElementById('filter-author').value.trim();
      const availOnly = document.getElementById('avail-only').checked;

      let endpoint = `/api/books/search?page=${page}&limit=9`;
      if (keyword) endpoint += `&title=${encodeURIComponent(keyword)}`;
      if (category) endpoint += `&category=${encodeURIComponent(category)}`;
      if (author) endpoint += `&author=${encodeURIComponent(author)}`;
      if (availOnly) endpoint += `&available=true`;

      const grid = document.getElementById('catalog-grid');
      grid.innerHTML = `<div class="col-12 text-center py-5"><div class="spinner-border text-warning"></div><p class="text-muted small mt-2">Searching academic catalog...</p></div>`;

      try {
        const res = await API.get(endpoint);
        let books = res.data?.data || [];
        const pagination = res.data?.pagination || { total: 0, pages: 1 };

        // Client sort
        const sortVal = document.getElementById('catalog-sort').value;
        if (sortVal === 'title_asc') books.sort((a,b) => a.title.localeCompare(b.title));
        if (sortVal === 'title_desc') books.sort((a,b) => b.title.localeCompare(a.title));
        if (sortVal === 'year_desc') books.sort((a,b) => (b.publicationYear || 0) - (a.publicationYear || 0));
        if (sortVal === 'copies_desc') books.sort((a,b) => (b.availableCopies || 0) - (a.availableCopies || 0));

        document.getElementById('catalog-count-label').innerText = `Showing ${books.length} of ${pagination.total} catalog volumes`;

        if (books.length === 0) {
          grid.innerHTML = `
            <div class="col-12 text-center py-5">
              <i class="bi bi-book display-4 text-muted opacity-50"></i>
              <h5 class="font-serif mt-3">No matching academic volumes</h5>
              <p class="text-muted small">Try removing active search filters or adjusting keywords.</p>
            </div>
          `;
          document.getElementById('catalog-pagination').innerHTML = '';
          return;
        }

        grid.innerHTML = books.map(b => {
          const isAvail = b.availableCopies > 0;
          const badgeClass = isAvail ? 'available' : 'unavailable';
          const badgeText = isAvail ? `${b.availableCopies} Copies Available` : 'Reserved / Out of Stock';

          let actionHtml = '';
          if (user?.role === 'MEMBER') {
            if (isAvail) {
              actionHtml = `<a href="/pages/book-details.html?id=${b._id}" class="btn btn-academic-outline btn-sm w-100">View Details & Borrow</a>`;
            } else {
              actionHtml = `<button class="btn btn-academic-gold btn-sm w-100" onclick="placeHold('${b._id}', '${escapeQuotes(b.title)}')"><i class="bi bi-bookmark-plus me-1"></i>Place Hold</button>`;
            }
          } else if (user?.role === 'LIBRARIAN' || user?.role === 'ADMIN') {
            actionHtml = `
              <div class="d-flex gap-2">
                <button class="btn btn-academic-primary btn-sm flex-grow-1" ${!isAvail ? 'disabled' : ''} onclick="openIssueModal('${b._id}', '${escapeQuotes(b.title)}')">Issue</button>
                <a href="/pages/book-details.html?id=${b._id}" class="btn btn-academic-outline btn-sm">Details</a>
              </div>
            `;
          } else {
            actionHtml = `<a href="/pages/login.html" class="btn btn-academic-outline btn-sm w-100">Sign in to Borrow</a>`;
          }

          return `
            <div class="col-md-6 col-lg-4">
              <div class="book-card-academic">
                <div class="book-cover-art">
                  <div class="book-cover-category">${b.category}</div>
                  <div class="book-cover-title" title="${b.title}">${b.title}</div>
                  <div class="book-cover-author">${b.author}</div>
                </div>
                <div class="book-card-body">
                  <div class="book-meta-row">
                    <span class="badge-status ${badgeClass}">
                      <i class="bi ${isAvail ? 'bi-check-circle-fill' : 'bi-dash-circle'}"></i>${badgeText}
                    </span>
                    <small class="text-muted">${b.publicationYear || ''}</small>
                  </div>
                  <p class="small text-muted mb-3 flex-grow-1" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                    ${b.description || 'Academic curriculum literature.'}
                  </p>
                  <div class="small text-muted mb-3 border-top pt-2">
                    <div><strong>ISBN:</strong> <code>${b.isbn}</code></div>
                  </div>
                  ${actionHtml}
                </div>
              </div>
            </div>
          `;
        }).join('');

        renderPagination(pagination);

      } catch (err) {
        grid.innerHTML = `<div class="col-12 alert alert-danger">${err.message}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const searchParam = urlParams.get('search');
      const catParam = urlParams.get('category');

      if (searchParam) document.getElementById('filter-keyword').value = searchParam;
      if (catParam) document.getElementById('filter-category').value = catParam;

      const user = API.getUser();
      if (user && (user.role === 'LIBRARIAN' || user.role === 'ADMIN')) {
        document.getElementById('staff-catalog-actions')?.classList.remove('d-none');
      }

      loadCatalog(1);
    });
  </script>
</body>
</html>
